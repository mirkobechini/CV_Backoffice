version: 2
updates:
  - package-ecosystem: composer
    directory: /
    target-branch: dev
    schedule:
      interval: weekly
    ignore:
      - dependency-name: laravel/framework
        update-types: [version-update:semver-major]

  - package-ecosystem: npm
    directory: /
    target-branch: dev
    schedule:
      interval: weekly

  - package-ecosystem: github-actions
    directory: /
    target-branch: dev
    schedule:
      interval: weekly
